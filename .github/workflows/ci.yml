name: CI

on:
  push:
    branches:
      - master
      - main
      - worktree-plan-windows-port
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Lint & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "windows/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: windows
        run: npm install

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: ">=6.1.0"

      - name: Bundle FFmpeg sidecar binaries
        shell: pwsh
        working-directory: windows/src-tauri
        run: |
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source
          Copy-Item $ffmpeg "binaries/ffmpeg-x86_64-pc-windows-msvc.exe" -Force
          Copy-Item $ffprobe "binaries/ffprobe-x86_64-pc-windows-msvc.exe" -Force
          Get-ChildItem binaries

      - name: Cargo Check Workspace
        working-directory: windows/src-tauri
        run: cargo check --workspace

      - name: Cargo Clippy
        working-directory: windows/src-tauri
        run: cargo clippy --workspace -- -D warnings

      - name: Cargo Test
        working-directory: windows/src-tauri
        run: cargo test --workspace

      - name: Build Tauri Desktop Executable
        working-directory: windows
        run: npm run tauri build -- --debug

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawvinci-windows-x64
          path: |
            windows/src-tauri/target/debug/clawvinci.exe
            windows/src-tauri/target/debug/bundle/**/*
          if-no-files-found: warn
