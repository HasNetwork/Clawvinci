<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clawvinci</title>
    <style>
      :root {
        --bg-base: #141518;
        --bg-surface: #1a1b1f;
        --bg-raised: #222328;
        --bg-prominent: #2c2d34;
        --border-subtle: rgba(255, 255, 255, 0.07);
        --border-primary: rgba(255, 255, 255, 0.12);
        --border-divider: rgba(255, 255, 255, 0.22);
        --text-primary: #f0f0f2;
        --text-secondary: #9b9ba3;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-base);
        color: var(--text-primary);
        height: 100vh;
        display: flex;
        flex-direction: column;
        user-select: none;
        overflow: hidden;
      }

      header {
        height: 44px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
      }

      .logo {
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-badge {
        font-size: 11px;
        background: var(--bg-raised);
        border: 1px solid var(--border-primary);
        padding: 2px 8px;
        border-radius: 4px;
        color: var(--text-secondary);
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        gap: 16px;
      }

      .preview-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        padding: 16px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        max-width: 800px;
        width: 100%;
      }

      .viewport {
        position: relative;
        background: #000;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 16 / 9;
        width: 100%;
        max-height: 420px;
      }

      canvas#preview-canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .transport-bar {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 12px;
        margin-top: 14px;
      }

      .btn {
        background: var(--bg-raised);
        border: 1px solid var(--border-primary);
        color: var(--text-primary);
        border-radius: 5px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .btn:hover {
        background: var(--bg-prominent);
        border-color: var(--border-divider);
      }

      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .btn.primary:hover {
        background: var(--accent-hover);
      }

      .scrub-slider {
        flex: 1;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .timecode {
        font-variant-numeric: tabular-nums;
        font-family: monospace;
        font-size: 13px;
        color: var(--text-primary);
        min-width: 90px;
        text-align: right;
      }

      .specs-summary {
        display: flex;
        gap: 16px;
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 8px;
      }

      footer {
        height: 28px;
        background: var(--bg-surface);
        border-top: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        font-size: 11px;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <span>🎬 Clawvinci</span>
      </div>
      <div class="status-badge" id="phase-badge">Phase 4.0 — Preview & Playback Engine</div>
    </header>

    <main>
      <div class="preview-container">
        <div class="viewport">
          <canvas id="preview-canvas" width="640" height="360"></canvas>
        </div>

        <div class="transport-bar">
          <button class="btn" id="btn-step-back" title="Step -1 Frame">⏮</button>
          <button class="btn primary" id="btn-play" title="Play / Pause">▶ Play</button>
          <button class="btn" id="btn-step-fwd" title="Step +1 Frame">⏭</button>
          <input type="range" class="scrub-slider" id="scrub-range" min="0" max="300" value="0" />
          <span class="timecode" id="timecode-display">00:00:00:00</span>
        </div>

        <div class="specs-summary">
          <span>Resolution: <strong id="res-display">1920x1080</strong></span>
          <span>FPS: <strong id="fps-display">30</strong></span>
          <span>Status: <strong id="status-display">Stopped</strong></span>
          <span>Engine Gen: <strong id="gen-display">1</strong></span>
        </div>
      </div>
    </main>

    <footer>
      <span>Clawvinci v0.1.0 (Windows Native)</span>
      <span>GPLv3</span>
    </footer>

    <script>
      const canvas = document.getElementById('preview-canvas');
      const ctx = canvas.getContext('2d');
      const btnPlay = document.getElementById('btn-play');
      const btnStepBack = document.getElementById('btn-step-back');
      const btnStepFwd = document.getElementById('btn-step-fwd');
      const scrubRange = document.getElementById('scrub-range');
      const timecodeDisplay = document.getElementById('timecode-display');
      const statusDisplay = document.getElementById('status-display');
      const genDisplay = document.getElementById('gen-display');

      let isPlaying = false;
      let currentFrame = 0;
      let fps = 30;

      function formatTimecode(frame, fpsVal) {
        const totalSec = Math.floor(frame / fpsVal);
        const f = frame % fpsVal;
        const s = totalSec % 60;
        const m = Math.floor(totalSec / 60) % 60;
        const h = Math.floor(totalSec / 3600);
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`;
      }

      function drawBlank() {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#222328';
        ctx.font = '12px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Clawvinci Canvas (Phase 4.0)', canvas.width / 2, canvas.height / 2);
      }

      drawBlank();

      async function invoke(cmd, args = {}) {
        if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
          return await window.__TAURI__.core.invoke(cmd, args);
        }
        return null;
      }

      async function refreshState() {
        try {
          const state = await invoke('playback_get_state');
          if (state) {
            currentFrame = state.currentFrame;
            fps = state.fps;
            isPlaying = state.status === 'playing';
            btnPlay.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
            scrubRange.value = currentFrame;
            timecodeDisplay.textContent = formatTimecode(currentFrame, fps);
            statusDisplay.textContent = state.status;
            genDisplay.textContent = state.generation;
          }
        } catch (e) {
          console.warn('Playback state query error:', e);
        }
      }

      btnPlay.addEventListener('click', async () => {
        try {
          const state = await invoke('playback_toggle');
          if (state) {
            isPlaying = state.status === 'playing';
            btnPlay.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
            statusDisplay.textContent = state.status;
          } else {
            isPlaying = !isPlaying;
            btnPlay.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
            statusDisplay.textContent = isPlaying ? 'playing' : 'paused';
          }
        } catch (e) {
          console.error(e);
        }
      });

      btnStepBack.addEventListener('click', async () => {
        try {
          const state = await invoke('playback_step', { delta: -1 });
          if (state) {
            currentFrame = state.currentFrame;
            scrubRange.value = currentFrame;
            timecodeDisplay.textContent = formatTimecode(currentFrame, fps);
          }
        } catch (e) {
          console.error(e);
        }
      });

      btnStepFwd.addEventListener('click', async () => {
        try {
          const state = await invoke('playback_step', { delta: 1 });
          if (state) {
            currentFrame = state.currentFrame;
            scrubRange.value = currentFrame;
            timecodeDisplay.textContent = formatTimecode(currentFrame, fps);
          }
        } catch (e) {
          console.error(e);
        }
      });

      scrubRange.addEventListener('input', async (e) => {
        const frame = parseInt(e.target.value, 10);
        timecodeDisplay.textContent = formatTimecode(frame, fps);
        try {
          await invoke('playback_seek', { frame, mode: 'interactiveScrub' });
        } catch (err) {
          console.error(err);
        }
      });

      refreshState();
    </script>
  </body>
</html>
