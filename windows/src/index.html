<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clawvinci</title>
    <link rel="stylesheet" href="app-theme.css" />
    <style>
      /* Layout & Panel Architecture */
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        background: var(--bg-base);
      }

      /* Header Bar */
      header {
        height: var(--header-height);
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--space-md);
        gap: var(--space-md);
        z-index: 10;
      }

      .header-left, .header-center, .header-right {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
      }

      .app-brand {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        font-weight: 600;
        font-size: var(--font-sm-md);
        letter-spacing: 0.5px;
        color: var(--text-primary);
        margin-right: var(--space-sm);
      }

      .project-title {
        font-size: var(--font-xs);
        color: var(--text-tertiary);
        padding: 2px 8px;
        background: var(--bg-raised);
        border-radius: var(--radius-xs);
        border: 1px solid var(--border-subtle);
      }

      .toolbar-sep {
        width: 1px;
        height: 18px;
        background: var(--border-subtle);
        margin: 0 var(--space-xs);
      }

      .btn {
        background: var(--bg-raised);
        border: 1px solid var(--border-primary);
        color: var(--text-primary);
        border-radius: var(--radius-xs);
        padding: 4px 10px;
        font-size: var(--font-xs);
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: background var(--anim-hover), border-color var(--anim-hover), opacity var(--anim-hover);
      }

      .btn:hover:not(:disabled) {
        background: var(--bg-prominent);
        border-color: var(--border-divider);
      }

      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .btn.primary {
        background: var(--accent-primary);
        border-color: var(--accent-primary);
        color: #000;
      }

      .btn.primary:hover:not(:disabled) {
        background: #fff;
      }

      .timecode-badge {
        font-size: var(--font-sm);
        color: var(--accent-timecode);
        background: rgba(242, 153, 51, 0.08);
        border: 1px solid rgba(242, 153, 51, 0.25);
        padding: 3px 8px;
        border-radius: var(--radius-xs);
        min-width: 95px;
        text-align: center;
      }

      .phase-badge {
        font-size: var(--font-xs);
        color: var(--text-tertiary);
        background: var(--bg-raised);
        border: 1px solid var(--border-subtle);
        padding: 2px 8px;
        border-radius: var(--radius-xs);
      }

      /* Main Workspace: Top 54%, Bottom 46% */
      main.workspace {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .workspace-top {
        height: 54%;
        display: flex;
        border-bottom: 1px solid var(--border-subtle);
        overflow: hidden;
      }

      .workspace-bottom {
        height: 46%;
        display: flex;
        flex-direction: column;
        background: var(--bg-surface);
        overflow: hidden;
      }

      /* Left: Media Panel */
      #media-panel-container {
        width: 270px;
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        background: var(--bg-surface);
      }

      .media-panel-header {
        height: 36px;
        padding: 0 var(--space-md);
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-subtle);
      }

      .media-panel-title {
        font-size: var(--font-xs);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-tertiary);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .media-count {
        background: var(--bg-raised);
        padding: 1px 6px;
        border-radius: var(--radius-pill);
        font-size: 10px;
      }

      .media-import-btn {
        background: var(--bg-raised);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        font-size: var(--font-xs);
        padding: 3px 8px;
        border-radius: var(--radius-xs);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .media-import-btn:hover {
        color: var(--text-primary);
        border-color: var(--border-primary);
      }

      .media-search-wrap {
        padding: 6px var(--space-md);
        position: relative;
        border-bottom: 1px solid var(--border-subtle);
      }

      .media-search-wrap .search-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
      }

      .media-search-input {
        width: 100%;
        background: var(--bg-raised);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-xs);
        color: var(--text-primary);
        font-size: var(--font-xs);
        padding: 4px 8px 4px 26px;
        outline: none;
      }
      .media-search-input:focus {
        border-color: var(--border-focus);
      }

      .media-grid {
        flex: 1;
        overflow-y: auto;
        padding: var(--space-sm);
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }

      .media-card {
        background: var(--bg-raised);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        padding: 6px;
        display: flex;
        gap: var(--space-sm);
        cursor: pointer;
        transition: border-color var(--anim-hover), background var(--anim-hover);
      }
      .media-card:hover {
        border-color: var(--border-primary);
        background: var(--bg-prominent);
      }

      .media-thumb {
        width: 60px;
        height: 38px;
        border-radius: var(--radius-xs);
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        color: var(--text-tertiary);
      }
      .media-thumb-audio {
        background: #192723;
        color: var(--clip-audio);
      }
      .thumb-duration {
        position: absolute;
        right: 3px;
        bottom: 2px;
        font-size: 8px;
        background: rgba(0,0,0,0.7);
        padding: 0 3px;
        border-radius: 2px;
        color: #fff;
      }

      .media-info {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .media-name {
        font-size: var(--font-xs);
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .media-meta {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .media-empty {
        text-align: center;
        padding: 24px 12px;
        color: var(--text-muted);
        font-size: var(--font-xs);
      }

      /* Center: Viewport */
      .viewport-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg-base);
        padding: var(--space-md);
        position: relative;
      }

      .viewport {
        aspect-ratio: 16 / 9;
        width: 100%;
        max-width: 640px;
        max-height: 100%;
        background: #000;
        border: 1px solid var(--border-primary);
        border-radius: var(--radius-xs);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-md);
      }

      canvas#preview-canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .viewport-overlay {
        position: absolute;
        bottom: 24px;
        display: flex;
        gap: var(--space-md);
        background: rgba(22, 23, 26, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-pill);
        padding: 3px 12px;
        font-size: 10px;
        color: var(--text-tertiary);
      }

      /* Right: Inspector */
      #inspector-panel {
        width: 320px;
        border-left: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        background: var(--bg-surface);
      }

      .inspector-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: var(--space-xl);
        color: var(--text-muted);
      }
      .empty-icon {
        color: var(--text-muted);
        margin-bottom: var(--space-sm);
      }
      .empty-title {
        font-size: var(--font-xs);
        color: var(--text-secondary);
        font-weight: 500;
        margin-bottom: 4px;
      }
      .empty-desc {
        font-size: 11px;
        line-height: 1.4;
      }

      .inspector-header {
        padding: var(--space-sm) var(--space-md);
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        gap: var(--space-sm);
      }
      .clip-badge {
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
        background: var(--bg-raised);
        border: 1px solid var(--border-subtle);
        padding: 2px 6px;
        border-radius: 3px;
        color: var(--text-secondary);
      }
      .clip-name {
        font-size: var(--font-xs);
        font-weight: 500;
        color: var(--text-primary);
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .clip-meta {
        font-size: 10px;
        color: var(--text-muted);
      }

      .inspector-tabs {
        display: flex;
        padding: 6px var(--space-md);
        gap: 6px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .inspector-tab-btn {
        flex: 1;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-xs);
        padding: 3px 0;
        font-size: var(--font-xs);
        color: var(--text-tertiary);
        cursor: pointer;
      }
      .inspector-tab-btn.active {
        background: var(--bg-raised);
        border-color: var(--border-subtle);
        color: var(--text-primary);
      }

      .inspector-body {
        flex: 1;
        overflow-y: auto;
        padding: var(--space-md);
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
      }
      .inspector-section {
        background: var(--bg-raised);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        padding: var(--space-sm);
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
      }
      .section-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
        margin-bottom: 2px;
      }
      .inspector-row {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
      }
      .inspector-label {
        width: 80px;
        font-size: var(--font-xs);
        color: var(--text-secondary);
        flex-shrink: 0;
      }
      .inspector-slider {
        flex: 1;
        accent-color: var(--accent-primary);
        cursor: pointer;
        height: 4px;
      }
      .inspector-val {
        width: 38px;
        text-align: right;
        font-size: 11px;
        color: var(--text-tertiary);
      }
      .inspector-textarea {
        width: 100%;
        background: var(--bg-base);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-xs);
        color: var(--text-primary);
        font-size: var(--font-xs);
        padding: 6px;
        resize: vertical;
        outline: none;
      }
      .inspector-textarea:focus {
        border-color: var(--border-focus);
      }

      /* Bottom: Timeline */
      .timeline-toolbar {
        height: 32px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--space-md);
      }

      .timeline-toolbar-left, .timeline-toolbar-right {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
      }

      .zoom-control {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: var(--text-muted);
      }
      .zoom-slider {
        width: 90px;
        accent-color: var(--accent-primary);
        height: 4px;
      }

      .timeline-scroll-area {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .timeline-headers {
        width: var(--track-header-width);
        border-right: 1px solid var(--border-subtle);
        background: var(--bg-surface);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        margin-top: var(--ruler-height);
      }

      .track-header {
        display: flex;
        align-items: center;
        padding: 0 var(--space-sm);
        gap: 6px;
        border-bottom: 1px solid var(--border-subtle);
        font-size: var(--font-xs);
        color: var(--text-secondary);
      }
      .track-badge {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: 700;
        color: #fff;
      }
      .track-badge-video { background: var(--clip-video); }
      .track-badge-audio { background: var(--clip-audio); }
      .track-badge-text { background: var(--clip-text); }
      .track-badge-image { background: var(--clip-image); }

      .track-title {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .track-controls {
        display: flex;
        gap: 2px;
      }
      .track-btn {
        width: 16px;
        height: 16px;
        border-radius: 2px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-raised);
        color: var(--text-muted);
        font-size: 8px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .track-btn.active {
        color: var(--accent-timecode);
        border-color: var(--accent-timecode);
      }

      .timeline-canvas-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-x: auto;
        overflow-y: hidden;
        position: relative;
        background: #111215;
      }

      #ruler-canvas {
        height: var(--ruler-height);
        flex-shrink: 0;
        cursor: crosshair;
      }

      #tracks-canvas {
        flex: 1;
        cursor: default;
      }

      /* Footer */
      footer {
        height: var(--footer-height);
        background: var(--bg-surface);
        border-top: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--space-md);
        font-size: 10px;
        color: var(--text-muted);
      }
      .footer-metrics {
        display: flex;
        gap: var(--space-md);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Top Bar -->
      <header>
        <div class="header-left">
          <div class="app-brand">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="2" width="20" height="20" rx="2.18"/>
              <line x1="7" y1="2" x2="7" y2="22"/>
              <line x1="17" y1="2" x2="17" y2="22"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <line x1="2" y1="7" x2="7" y2="7"/>
              <line x1="2" y1="17" x2="7" y2="17"/>
              <line x1="17" y1="17" x2="22" y2="17"/>
              <line x1="17" y1="7" x2="22" y2="7"/>
            </svg>
            <span>Clawvinci</span>
          </div>
          <span class="project-title">Demo Project</span>

          <div class="toolbar-sep"></div>

          <!-- Undo / Redo -->
          <button class="btn" id="btn-undo" title="Undo (Ctrl+Z)" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            <span>Undo</span>
          </button>
          <button class="btn" id="btn-redo" title="Redo (Ctrl+Y)" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
            <span>Redo</span>
          </button>
        </div>

        <div class="header-center">
          <!-- Transport Controls -->
          <button class="btn" id="btn-step-back" title="Step -1 Frame (Left Arrow)">⏮</button>
          <button class="btn primary" id="btn-play" title="Play / Pause (Space)">▶ Play</button>
          <button class="btn" id="btn-step-fwd" title="Step +1 Frame (Right Arrow)">⏭</button>
          <div class="timecode-badge tabular-nums" id="timecode-display">00:00:00:00</div>
        </div>

        <div class="header-right">
          <button class="btn" id="btn-add-track" title="Insert new track">+ Track</button>
          <div class="phase-badge">Phase 6.0 — UI Shell</div>
        </div>
      </header>

      <!-- Workspace Area -->
      <main class="workspace">
        <!-- Top Half -->
        <div class="workspace-top">
          <!-- Left: Media Panel -->
          <div id="media-panel-container"></div>

          <!-- Center: Preview Viewport -->
          <div class="viewport-container">
            <div class="viewport">
              <canvas id="preview-canvas" width="640" height="360"></canvas>
            </div>
            <div class="viewport-overlay tabular-nums">
              <span>Resolution: <strong id="res-display" style="color:var(--text-secondary)">1920x1080</strong></span>
              <span>•</span>
              <span>FPS: <strong id="fps-display" style="color:var(--text-secondary)">30</strong></span>
              <span>•</span>
              <span>Engine Gen: <strong id="gen-display" style="color:var(--text-secondary)">1</strong></span>
            </div>
          </div>

          <!-- Right: Inspector -->
          <div id="inspector-panel"></div>
        </div>

        <!-- Bottom Half: Timeline -->
        <div class="workspace-bottom" id="timeline-container">
          <div class="timeline-toolbar">
            <div class="timeline-toolbar-left">
              <button class="btn" id="btn-split" title="Split Clip at Playhead (S)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"/><path d="M19 5l-7 7-7-7"/></svg>
                <span>Split (S)</span>
              </button>
              <button class="btn" id="btn-ripple-delete" title="Ripple Delete Selected Clip (Del)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                <span>Ripple Delete</span>
              </button>
            </div>
            <div class="timeline-toolbar-right">
              <div class="zoom-control">
                <span>Zoom</span>
                <input type="range" class="zoom-slider" id="zoom-slider" min="0.5" max="8.0" step="0.1" value="2.0" />
              </div>
            </div>
          </div>

          <div class="timeline-scroll-area">
            <div class="timeline-headers" id="track-headers"></div>
            <div class="timeline-canvas-wrap" id="canvas-wrap">
              <canvas id="ruler-canvas" width="2400" height="26"></canvas>
              <canvas id="tracks-canvas" width="2400" height="180"></canvas>
            </div>
          </div>
        </div>
      </main>

      <!-- Status Footer -->
      <footer>
        <div class="footer-status">
          <span>Clawvinci Studio v0.1.0 (Windows Native)</span>
          <span> — </span>
          <span id="engine-status" style="color:var(--text-secondary)">Stopped</span>
        </div>
        <div class="footer-metrics tabular-nums">
          <span>Frame: <strong id="metric-frame">0</strong></span>
          <span>Duration: <strong id="metric-duration">00:00:08:00</strong></span>
          <span>Undo States: <strong id="metric-undo">0</strong></span>
        </div>
      </footer>
    </div>

    <!-- Application Script Wiring -->
    <script type="module">
      import { TimelineEngine } from './timeline.js';
      import { InspectorPanel } from './inspector.js';
      import { MediaPanel } from './media_panel.js';

      const canvas = document.getElementById('preview-canvas');
      const ctx = canvas.getContext('2d');
      const btnPlay = document.getElementById('btn-play');
      const btnStepBack = document.getElementById('btn-step-back');
      const btnStepFwd = document.getElementById('btn-step-fwd');
      const btnUndo = document.getElementById('btn-undo');
      const btnRedo = document.getElementById('btn-redo');
      const btnSplit = document.getElementById('btn-split');
      const btnRippleDelete = document.getElementById('btn-ripple-delete');
      const btnAddTrack = document.getElementById('btn-add-track');
      const zoomSlider = document.getElementById('zoom-slider');
      const timecodeDisplay = document.getElementById('timecode-display');
      const engineStatus = document.getElementById('engine-status');
      const genDisplay = document.getElementById('gen-display');
      const metricFrame = document.getElementById('metric-frame');
      const metricDuration = document.getElementById('metric-duration');
      const metricUndo = document.getElementById('metric-undo');

      let currentFrame = 0;
      let fps = 30;
      let isPlaying = false;
      let activeTimeline = null;

      async function invoke(cmd, args = {}) {
        if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
          return await window.__TAURI__.core.invoke(cmd, args);
        }
        return null;
      }

      function formatTimecode(frame, fpsVal) {
        const totalSec = Math.floor(frame / fpsVal);
        const f = Math.floor(frame % fpsVal);
        const s = totalSec % 60;
        const m = Math.floor(totalSec / 60) % 60;
        const h = Math.floor(totalSec / 3600);
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`;
      }

      // Initialize Inspector
      const inspector = new InspectorPanel({
        container: document.getElementById('inspector-panel'),
        onUpdateTransform: async (params) => {
          try {
            const tl = await invoke('timeline_update_clip_transform', {
              clipId: params.clipId,
              centerX: params.centerX,
              centerY: params.centerY,
              width: params.width,
              height: params.height,
              rotation: params.rotation,
              opacity: params.opacity,
            });
            if (tl) updateTimelineState(tl);
            renderCurrentFramePreview();
          } catch (e) {
            console.error(e);
          }
        },
        onUpdateEffect: async (clipId, effectType, paramKey, value) => {
          try {
            const tl = await invoke('timeline_update_clip_effect', {
              clipId,
              effectType,
              paramKey,
              value,
            });
            if (tl) updateTimelineState(tl);
            renderCurrentFramePreview();
          } catch (e) {
            console.error(e);
          }
        },
        onUpdateText: async (clipId, text, fontSize) => {
          try {
            const tl = await invoke('timeline_update_clip_text', {
              clipId,
              text,
              fontSize,
            });
            if (tl) updateTimelineState(tl);
            renderCurrentFramePreview();
          } catch (e) {
            console.error(e);
          }
        },
      });

      // Initialize Timeline Engine
      const timelineEngine = new TimelineEngine({
        container: document.getElementById('timeline-container'),
        rulerCanvas: document.getElementById('ruler-canvas'),
        tracksCanvas: document.getElementById('tracks-canvas'),
        headersContainer: document.getElementById('track-headers'),
        onSeek: async (frame, mode) => {
          currentFrame = frame;
          timecodeDisplay.textContent = formatTimecode(frame, fps);
          metricFrame.textContent = frame;
          try {
            await invoke('playback_seek', { frame, mode });
            renderCurrentFramePreview();
          } catch (e) {
            console.error(e);
          }
        },
        onSelectClip: (clip, trackIndex) => {
          inspector.setClip(clip, trackIndex);
        },
        onTimelineMutate: async (action, params) => {
          try {
            let tl = null;
            if (action === 'move') {
              tl = await invoke('timeline_move_clips', {
                moves: [[params.clipId, params.trackIndex, params.delta]],
              });
            } else if (action === 'trim') {
              tl = await invoke('timeline_trim_clip', {
                clipId: params.clipId,
                edge: params.edge,
                delta: params.delta,
              });
            }
            if (tl) {
              updateTimelineState(tl);
              renderCurrentFramePreview();
            }
          } catch (e) {
            console.error('Mutation error:', e);
          }
        },
      });

      // Initialize Media Panel
      const mediaPanel = new MediaPanel({
        container: document.getElementById('media-panel-container'),
        onImport: async (path) => {
          try {
            const item = await invoke('media_import', { path });
            if (item) {
              const items = await invoke('media_list');
              mediaPanel.setItems(items);
            }
          } catch (e) {
            console.error('Media import error:', e);
          }
        },
        onAddToTimeline: async (item) => {
          // Double-click media to add to track 0 at playhead
          console.log('Add to timeline:', item);
        },
      });

      function updateTimelineState(tl) {
        activeTimeline = tl;
        timelineEngine.setTimeline(tl, currentFrame);

        // Update total duration metric
        let maxFrame = 0;
        if (tl && tl.tracks) {
          tl.tracks.forEach(tr => {
            tr.clips.forEach(c => {
              maxFrame = Math.max(maxFrame, c.startFrame + c.durationFrames);
            });
          });
        }
        metricDuration.textContent = formatTimecode(maxFrame, fps);
        refreshHistoryStatus();
      }

      async function refreshHistoryStatus() {
        try {
          const hist = await invoke('timeline_history_status');
          if (hist) {
            btnUndo.disabled = !hist.canUndo;
            btnRedo.disabled = !hist.canRedo;
            btnUndo.title = hist.undoName ? `Undo ${hist.undoName} (Ctrl+Z)` : 'Undo (Ctrl+Z)';
            btnRedo.title = hist.redoName ? `Redo ${hist.redoName} (Ctrl+Y)` : 'Redo (Ctrl+Y)';
          }
        } catch (e) {
          console.warn(e);
        }
      }

      async function renderCurrentFramePreview() {
        try {
          const res = await invoke('playback_render_frame', { frame: currentFrame });
          if (res && res.rgbaBase64) {
            const img = new Image();
            img.onload = () => {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };
            img.src = `data:image/raw;base64,${res.rgbaBase64}`;
          }
        } catch (e) {
          // Frame composition fallback
          ctx.fillStyle = '#0a0a0d';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#f0f0f2';
          ctx.font = '14px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`Clawvinci Frame ${currentFrame}`, canvas.width / 2, canvas.height / 2);
        }
      }

      async function syncPlaybackState() {
        try {
          const state = await invoke('playback_get_state');
          if (state) {
            currentFrame = state.currentFrame;
            fps = state.fps;
            isPlaying = state.status === 'playing';
            btnPlay.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
            engineStatus.textContent = state.status;
            genDisplay.textContent = state.generation;
            timecodeDisplay.textContent = formatTimecode(currentFrame, fps);
            metricFrame.textContent = currentFrame;
            timelineEngine.setFrame(currentFrame);
          }
        } catch (e) {
          console.warn(e);
        }
      }

      // Toolbar button listeners
      btnPlay.addEventListener('click', async () => {
        try {
          const state = await invoke('playback_toggle');
          if (state) {
            isPlaying = state.status === 'playing';
            btnPlay.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
            engineStatus.textContent = state.status;
          }
        } catch (e) {
          console.error(e);
        }
      });

      btnStepBack.addEventListener('click', async () => {
        try {
          const state = await invoke('playback_step', { delta: -1 });
          if (state) {
            currentFrame = state.currentFrame;
            timelineEngine.setFrame(currentFrame);
            timecodeDisplay.textContent = formatTimecode(currentFrame, fps);
            metricFrame.textContent = currentFrame;
            renderCurrentFramePreview();
          }
        } catch (e) {
          console.error(e);
        }
      });

      btnStepFwd.addEventListener('click', async () => {
        try {
          const state = await invoke('playback_step', { delta: 1 });
          if (state) {
            currentFrame = state.currentFrame;
            timelineEngine.setFrame(currentFrame);
            timecodeDisplay.textContent = formatTimecode(currentFrame, fps);
            metricFrame.textContent = currentFrame;
            renderCurrentFramePreview();
          }
        } catch (e) {
          console.error(e);
        }
      });

      btnUndo.addEventListener('click', async () => {
        try {
          const tl = await invoke('timeline_undo');
          if (tl) {
            updateTimelineState(tl);
            renderCurrentFramePreview();
          }
        } catch (e) {
          console.error('Undo error:', e);
        }
      });

      btnRedo.addEventListener('click', async () => {
        try {
          const tl = await invoke('timeline_redo');
          if (tl) {
            updateTimelineState(tl);
            renderCurrentFramePreview();
          }
        } catch (e) {
          console.error('Redo error:', e);
        }
      });

      btnSplit.addEventListener('click', async () => {
        const sel = timelineEngine.getSelectedClip();
        if (sel) {
          try {
            const tl = await invoke('timeline_split_clip', {
              clipId: sel.clip.id,
              atFrame: currentFrame,
            });
            if (tl) {
              updateTimelineState(tl);
              renderCurrentFramePreview();
            }
          } catch (e) {
            console.error('Split error:', e);
          }
        }
      });

      btnRippleDelete.addEventListener('click', async () => {
        const sel = timelineEngine.getSelectedClip();
        if (sel) {
          try {
            const tl = await invoke('timeline_ripple_delete', {
              clipIds: [sel.clip.id],
            });
            if (tl) {
              timelineEngine.selectedClipId = null;
              inspector.setClip(null, -1);
              updateTimelineState(tl);
              renderCurrentFramePreview();
            }
          } catch (e) {
            console.error('Ripple delete error:', e);
          }
        }
      });

      btnAddTrack.addEventListener('click', async () => {
        try {
          const tl = await invoke('timeline_insert_track', { trackType: 'video' });
          if (tl) updateTimelineState(tl);
        } catch (e) {
          console.error('Add track error:', e);
        }
      });

      zoomSlider.addEventListener('input', (e) => {
        timelineEngine.setZoom(parseFloat(e.target.value));
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', async (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        if (e.code === 'Space') {
          e.preventDefault();
          btnPlay.click();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          btnStepBack.click();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          btnStepFwd.click();
        } else if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
          e.preventDefault();
          if (e.shiftKey) {
            btnRedo.click();
          } else {
            btnUndo.click();
          }
        } else if ((e.ctrlKey || e.metaKey) && e.code === 'KeyY') {
          e.preventDefault();
          btnRedo.click();
        } else if (e.code === 'KeyS' || e.code === 'KeyC') {
          e.preventDefault();
          btnSplit.click();
        } else if (e.code === 'Delete' || e.code === 'Backspace') {
          e.preventDefault();
          btnRippleDelete.click();
        }
      });

      // Initial Bootstrap
      async function init() {
        try {
          const tl = await invoke('timeline_get');
          if (tl) {
            updateTimelineState(tl);
          }
          const media = await invoke('media_list');
          if (media) {
            mediaPanel.setItems(media);
          }
          await syncPlaybackState();
          await renderCurrentFramePreview();
        } catch (e) {
          console.warn('Initial load:', e);
        }
      }

      init();
    </script>
  </body>
</html>
