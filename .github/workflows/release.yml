name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "windows/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: windows
        run: npm install

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Cargo Test
        working-directory: windows/src-tauri
        run: cargo test --workspace

      - name: Build Tauri Desktop Release
        working-directory: windows
        run: npm run tauri build

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          
          # Copy NSIS installer if generated
          Get-ChildItem -Path "windows/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist-artifacts/"
          }
          
          # Copy standalone executable
          if (Test-Path "windows/src-tauri/target/release/clawvinci.exe") {
            Copy-Item "windows/src-tauri/target/release/clawvinci.exe" -Destination "dist-artifacts/"
            Compress-Archive -Path "windows/src-tauri/target/release/clawvinci.exe" -DestinationPath "dist-artifacts/clawvinci-windows-x64-portable.zip" -Force
          }

          # Generate SHA256 checksums
          Get-ChildItem -Path dist-artifacts/* | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath "dist-artifacts/checksums.sha256" -Append -Encoding utf8
          }

          Get-ChildItem -Path dist-artifacts

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clawvinci-windows-release
          path: dist-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Clawvinci ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist-artifacts/*
